  *{box-sizing:border-box}
  body{margin:0;background:var(--soft);color:var(--body);text-align:center;
    font:16px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,Arial,sans-serif;-webkit-font-smoothing:antialiased}
  .wrap{max-width:820px;margin:0 auto;padding:0 24px}
  .bar{background:#fff;border-bottom:1px solid var(--line)}
  .bar .wrap{height:52px;display:flex;align-items:center;justify-content:center}
  .brand{font-weight:800;color:var(--ink);letter-spacing:-.02em;font-size:18px;text-decoration:none}
  .brand span{color:var(--blue)}
  .hero{padding:26px 0 0}
  h1{color:var(--ink);font-size:clamp(26px,4.4vw,40px);font-weight:800;line-height:1.15;letter-spacing:-.02em;margin:0;text-wrap:balance}
  .sub{margin:8px 0 0;font-size:16px}
  .card{margin:20px auto 0;background:#fff;border:1px solid var(--line);border-radius:18px;overflow:hidden;
    box-shadow:0 24px 60px -34px rgba(20,24,31,.4)}
  .card iframe{width:100%;min-height:820px;border:0;display:block}
  .proof{display:inline-block;margin:22px 0 0;color:var(--blue);font-weight:700;text-decoration:none}
  .proof:hover{text-decoration:underline}
  footer{padding:20px 0 40px;color:var(--muted);font-size:13px}
  @media(max-width:620px){
    .wrap{padding:0 16px}
    .card{margin-left:-16px;margin-right:-16px;border-radius:0;border-left:0;border-right:0}
    .card iframe{min-height:900px}
  }
</style>

<div class="bar"><div class="wrap"><a class="brand" href="/proof/">Quantum <span>Qube</span></a></div></div>

<div class="wrap">
  <div class="hero">
    <h1>Book a call with Jonathan</h1>
    <p class="sub">Pick a time that works for you.</p>
  </div>
  <div class="card">
    <iframe id="calFrame" src="about:blank" scrolling="no" title="Book a call"></iframe>
  </div>
  <a class="proof" href="/proof/">See the results we've gotten for our clients &rarr;</a>
</div>

<footer><div class="wrap">&copy; Quantum Qube</div></footer>
